spring.application.name=investe-api

# Threads virtuais para as chamadas as APIs externas (Fase 3)
spring.threads.virtual.enabled=true

# Actuator: expoe /actuator/health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Fonte: AwesomeAPI (cotacoes de moedas)
investe.cotacao.base-url=https://economia.awesomeapi.com.br
investe.cotacao.connect-timeout=2s
investe.cotacao.read-timeout=3s
